<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MessiCandy Football Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; font-size: 2.3rem; text-shadow: 2px 2px rgba(0,0,0,0.6); }
        .level-badge {
            background: #e74c3c; padding: 4px 15px; border-radius: 15px;
            font-weight: bold; font-size: 0.9rem; margin-bottom: 10px;
        }
        .stats {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%; max-width: 330px;
            display: flex; justify-content: space-between;
        }
        .stats span { color: #f1c40f; }
        .progress-container {
            width: 100%; max-width: 330px; background: #444;
            border-radius: 10px; height: 12px; margin-bottom: 15px; overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 0%; height: 100%; transition: width 0.3s ease;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(7, 44px);
            grid-template-rows: repeat(7, 44px);
            gap: 5px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            touch-action: none;
        }
        @media (min-width: 400px) {
            #grid { grid-template-columns: repeat(7, 46px); grid-template-rows: repeat(7, 46px); }
        }
        .cell {
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn {
            margin-top: 15px;
            background: #e91e63;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%; max-width: 330px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #009ee3;
            z-index: 100;
            width: 85%; max-width: 320px;
        }
        .modal h2 { color: #f1c40f; margin-bottom: 10px; }
        .modal input {
            padding: 10px; margin: 12px 0; width: 90%;
            text-align: center; font-size: 1rem; border-radius: 5px;
            color: #000; font-weight: bold;
        }
        .mp-link {
            display: inline-block; background: #009ee3; color: white;
            padding: 12px 24px; border-radius: 20px; text-decoration: none;
            font-weight: bold; margin-bottom: 10px; width: 90%;
        }
    </style>
</head>
<body>

    <h1>MessiCandy ⚽</h1>
    <div class="level-badge">Nivel <span id="lbl-level">1</span></div>

    <div class="stats">
        <div>Pts: <span id="score">0</span>/<span id="target">500</span></div>
        <div>Movs: <span id="moves">20</span></div>
    </div>

    <div class="progress-container {">
        <div id="progress" class="progress-fill"></div>
    </div>

    <div id="grid"></div>

    <button class="btn" onclick="openShop()">🛒 Tienda: +5 Movimientos (0.99)</button>

    <div id="modal" class="modal">
        <h2 id="m-title">Tienda MessiCandy</h2>
        <p id="m-text">Consigue 5 movimientos extra</p>
        
        <a class="mp-link" target="_blank" rel="noopener noreferrer" href="https://mpago.la">Pagar 0.99 con Mercado Pago</a>
        
        <p style="font-size:0.8rem; color:#aaa;">(Tras abonar, escribe el código secreto de tu recibo)</p>
        <input type="text" id="code" placeholder="Código Secreto">
        <button class="btn" style="margin-top:0; width:90%; background:#009ee3;" onclick="verify()">Activar Movimientos</button>
        <button class="btn" style="background:#444; font-size:0.8rem; padding:5px 10px; width:90%;" onclick="closeModal()">Cerrar</button>
    </div>

    <script>
        const width = 7;
        const grid = document.getElementById('grid');
        
        // REEMPLAZADOS: Tus nuevos caramelos de jugadores estrella
        const candies = ['🔟', '🧤', '🏃‍♂️', '👑', '🤖'];
        
        // CONFIGURACIÓN DE DIFICULTAD POR NIVEL
        const nivelesDificultad = [
            { target: 500, moves: 20 },
            { target: 1200, moves: 18 },
            { target: 2000, moves: 15 },
            { target: 3500, moves: 12 }
        ];

        let board = [];
        let score = 0;
        let moves = 20;
        let level = 1;
        let targetScore = 500;
        
        let startX, startY, activeCellId = null;

        function start() {
            grid.innerHTML = '';
            board = [];
            
            // Asignar dificultad según el nivel actual
            let configActual = nivelesDificultad[level - 1] || { target: 5000, moves: 10 };
            targetScore = configActual.target;
            moves = configActual.moves;

            document.getElementById('lbl-level').innerText = level;
            document.getElementById('target').innerText = targetScore;
            document.getElementById('moves').innerText = moves;
            document.getElementById('score').innerText = score;
            document.getElementById('progress').style.width = '0%';

            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = i;
                cell.innerText = candies[Math.floor(Math.random() * candies.length)];
                
                // Eventos táctiles originales intactos con el [0] que corresponde
                cell.addEventListener('touchstart', handleTouchStart, {passive: true});
                cell.addEventListener('touchend', handleTouchEnd, {passive: true});
                
                grid.appendChild(cell);
                board.push(cell);
            }
            match(true);
        }

        function handleTouchStart(e) {
            if (moves <= 0) return;
            activeCellId = parseInt(this.id);
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (activeCellId === null) return;
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;
            let targetId = null;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) targetId = diffX > 0 ? activeCellId + 1 : activeCellId - 1;
            } else {
                if (Math.abs(diffY) > 30) targetId = diffY > 0 ? activeCellId + width : activeCellId - width;
            }

            if (targetId !== null && targetId >= 0 && targetId < 49) {
                if (!(activeCellId % width === 0 && targetId === activeCellId - 1) && 
                    !(activeCellId % width === width - 1 && targetId === activeCellId + 1)) {
                    swapCells(activeCellId, targetId);
                }
            }
            activeCellId = null;
        }

        function swapCells(id1, id2) {
            let cell1 = board[id1];
            let cell2 = board[id2];
            let tmp = cell1.innerText;
            
            cell1.innerText = cell2.innerText;
            cell2.innerText = tmp;

            let hasMatches = match(false);

            if (!hasMatches) {
                setTimeout(() => {
                    cell2.innerText = cell1.innerText;
                    cell1.innerText = tmp;
                    match(true);
                }, 250);
            } else {
                moves--;
                document.getElementById('moves').innerText = moves;
                verificarProgreso();
            }
        }

        function match(forceRefill) {
            let matchFound = false;
            let toBlast = new Set();

            for (let i = 0; i < 49; i++) {
                if (i % width < 5) {
                    let r1 = board[i].innerText;
                    let r2 = board[i+1].innerText;
                    let r3 = board[i+2].innerText;
                    if (r1 && r1 === r2 && r1 === r3) {
                        toBlast.add(i); toBlast.add(i+1); toBlast.add(i+2);
                        matchFound = true;
                    }
                }
            }

            for (let i = 0; i < 35; i++) {
                let c1 = board[i].innerText;
                let c2 = board[i+width].innerText;
                let c3 = board[i+width*2].innerText;
                if (c1 && c1 === c2 && c1 === c3) {
                    toBlast.add(i); toBlast.add(i+width); toBlast.add(i+width*2);
                    matchFound = true;
                }
            }

            if (matchFound && !forceRefill) {
                score += toBlast.size * 10;
