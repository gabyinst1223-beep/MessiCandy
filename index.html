<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MessiCandy Football Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            /* Fondo de cancha de fútbol */
            background: linear-gradient(rgba(15, 32, 39, 0.85), rgba(32, 58, 67, 0.85)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; font-size: 2.3rem; text-shadow: 2px 2px rgba(0,0,0,0.6); font-style: italic; }
        .level-badge {
            background: #e74c3c; padding: 4px 15px; border-radius: 15px;
            font-weight: bold; font-size: 0.9rem; margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stats {
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%; max-width: 340px;
            display: flex; justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stats span { color: #f1c40f; }
        .progress-container {
            width: 100%; max-width: 340px; background: #444;
            border-radius: 10px; height: 12px; margin-bottom: 15px; overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 0%; height: 100%; transition: width 0.3s ease;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(7, 46px);
            grid-template-rows: repeat(7, 46px);
            gap: 5px;
            /* Tablero verde césped */
            background: radial-gradient(circle, rgba(39, 174, 96, 0.9), rgba(30, 130, 76, 0.95));
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            touch-action: none;
            border: 3px solid #f1c40f;
        }
        @media (min-width: 400px) {
            #grid { grid-template-columns: repeat(7, 48px); grid-template-rows: repeat(7, 48px); }
        }
        .cell {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cell:active { transform: scale(0.9); }
        .btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #009ee3, #007bb5);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,158,227,0.4);
            width: 100%; max-width: 340px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 17, 17, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #f1c40f;
            z-index: 100;
            width: 85%; max-width: 320px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal h2 { color: #f1c40f; margin-bottom: 10px; }
        .modal input {
            padding: 12px; margin: 12px 0; width: 90%;
            text-align: center; font-size: 1rem; border-radius: 8px;
            border: none; color: #000; font-weight: bold;
        }
        .mp-link {
            display: inline-block; background: #009ee3; color: white;
            padding: 14px 24px; border-radius: 25px; text-decoration: none;
            font-weight: bold; margin-bottom: 10px; width: 90%;
            box-shadow: 0 4px 10px rgba(0,158,227,0.3);
        }
        .overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); z-index: 99;
        }
    </style>
</head>
<body>

    <h1>MessiCandy ⚽</h1>
    <div class="level-badge" id="level-name">Potrero (Nivel 1)</div>

    <div class="stats">
        <div>Pts: <span id="score">0</span>/<span id="target">500</span></div>
        <div>Movs: <span id="moves">20</span></div>
    </div>

    <div class="progress-container">
        <div id="progress" class="progress-fill"></div>
    </div>

    <div id="grid"></div>

    <button class="btn" onclick="openShop()">🛒 Tienda: +5 Movimientos (0.99)</button>

    <div class="overlay" id="overlay"></div>
    <div id="modal" class="modal">
        <h2 id="m-title">Tienda Oficial</h2>
        <p id="m-text" style="margin-bottom: 15px;">Consigue 5 movimientos extra</p>
        
        <a class="mp-link" target="_blank" rel="noopener noreferrer" href="https://mpago.la">Pagar con Mercado Pago</a>
        
        <p style="font-size:0.8rem; color:#aaa; margin-top: 10px;">(Tras abonar, escribe el código de tu recibo)</p>
        <input type="text" id="code" placeholder="Código de Validación">
        <button class="btn" style="margin-top:0; width:90%; background:#2ecc71; box-shadow:0 4px 10px rgba(46,204,113,0.3);" onclick="verify()">Activar Movimientos</button>
        <button class="btn" style="background:#444; font-size:0.8rem; padding:6px 10px; width:90%; box-shadow:none;" onclick="closeModal()">Volver al Partido</button>
    </div>

    <script>
        const width = 7;
        const grid = document.getElementById('grid');
        
        // Elementos del juego (Cracks del fútbol)
        const candies = ['🔟', '🧤', '🏃‍♂️', '👑', '🤖'];
        
        // Niveles con sus dificultades
        const nivelesInfo = [
            { name: "Potrero (Nivel 1)", target: 500, moves: 20 },
            { name: "Debut en Primera (Nivel 2)", target: 1200, moves: 18 },
            { name: "Copa Libertadores (Nivel 3)", target: 2000, moves: 15 },
            { name: "Final del Mundo (Nivel 4)", target: 3500, moves: 12 }
        ];

        let board = [];
        let score = 0;
        let moves = 20;
        let currentLevelIndex = 0;
        let targetScore = 500;
        
        let startX, startY, activeCellId = null;

        function start() {
            grid.innerHTML = '';
            board = [];
            let nivelActual = nivelesInfo[currentLevelIndex];
            
            targetScore = nivelActual.target;
            moves = nivelActual.moves;
            
            document.getElementById('level-name').innerText = nivelActual.name;
            document.getElementById('target').innerText = targetScore;
            document.getElementById('moves').innerText = moves;
            document.getElementById('score').innerText = score;
            updateProgressBar();

            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = i;
                cell.innerText = candies[Math.floor(Math.random() * candies.length)];
                
                cell.addEventListener('touchstart', handleTouchStart, {passive: true});
                cell.addEventListener('touchend', handleTouchEnd, {passive: true});
                
                grid.appendChild(cell);
                board.push(cell);
            }
            checkAndExecuteMatches();
        }

        function handleTouchStart(e) {
            if (moves <= 0) return;
            activeCellId = parseInt(this.id);
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (activeCellId === null) return;
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;
            let targetId = null;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) targetId = diffX > 0 ? activeCellId + 1 : activeCellId - 1;
            } else {
                if (Math.abs(diffY) > 30) targetId = diffY > 0 ? activeCellId + width : activeCellId - width;
            }

            if (targetId !== null && targetId >= 0 && targetId < 49) {
                if (!(activeCellId % width === 0 && targetId === activeCellId - 1) && 
                    !(activeCellId % width === width - 1 && targetId === activeCellId + 1)) {
                    swapCells(activeCellId, targetId);
                }
            }
            activeCellId = null;
        }

        function swapCells(id1, id2) {
            let cell1 = board[id1];
            let cell2 = board[id2];
            let tmp = cell1.innerText;
            
            cell1.innerText = cell2.innerText;
            cell2.innerText = tmp;

            let hasMatches = checkAndExecuteMatches();

            if (!hasMatches) {
                setTimeout(() => {
                    cell2.innerText = cell1.innerText;
                    cell1.innerText = tmp;
