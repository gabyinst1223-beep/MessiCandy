<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>MessiCandy - Match 3</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --panel-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); color: #f1c40f; }
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-box { font-size: 1.2rem; font-weight: bold; }
        .stat-val { color: #f1c40f; }
        #game-container {
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(7, 45px);
            grid-template-rows: repeat(7, 45px);
            gap: 4px;
        }
        @media (min-width: 450px) {
            #grid { grid-template-columns: repeat(7, 55px); grid-template-rows: repeat(7, 55px); gap: 6px; }
        }
        .cell {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
        }
        .cell:active { transform: scale(0.9); }
        .cell.selected { background: rgba(255, 255, 255, 0.3); box-shadow: 0 0 10px #fff; }
        .btn {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-pay { background: #e91e63; color: white; }
        .btn-pay:hover { background: #c2185b; }
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            border-radius: 15px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .modal h2 { color: #f1c40f; margin-bottom: 15px; }
        .modal p { font-size: 1rem; margin-bottom: 15px; line-height: 1.4; }
        .modal input {
            padding: 8px; font-size: 1rem; border-radius: 5px; border: none;
            margin-bottom: 10px; width: 80%; text-align: center;
        }
        .paypal-link {
            display: inline-block; background: #0070ba; color: white;
            padding: 10px 20px; border-radius: 20px; text-decoration: none;
            font-weight: bold; margin-bottom: 15px;
        }
    </style>
</head>

    <script>
        const width = 7;
        const grid = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const movesDisplay = document.getElementById('moves');
        const modal = document.getElementById('modal');
        
        const candyTypes = ['🔴', '🔵', '🟢', '🟡', '🟣'];
        let board = [];
        let score = 0;
        let moves = 20;
        let selectedCell = null;

        function createBoard() {
            grid.innerHTML = '';
            board = [];
            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('draggable', 'true');
                cell.setAttribute('id', i);
                let randomCandy = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                cell.innerText = randomCandy;
                grid.appendChild(cell);
                board.push(cell);

                cell.addEventListener('click', selectCell);
            }
            checkMatches();
        }

        function selectCell() {
            if (moves <= 0) return;
            if (!selectedCell) {
                selectedCell = this;
                this.classList.add('selected');
            } else {
                let id1 = parseInt(selectedCell.id);
                let id2 = parseInt(this.id);
                
                const validMoves = [id1 - 1, id1 + 1, id1 - width, id1 + width];
                const isAdjacent = validMoves.includes(id2);

                if (isAdjacent) {
                    let temp = selectedCell.innerText;
                    selectedCell.innerText = this.innerText;
                    this.innerText = temp;

                    moves--;
                    movesDisplay.innerText = moves;

                    checkMatches();
                    if (moves <= 0) showGameOver();
                }

                selectedCell.classList.remove('selected');
                selectedCell = null;
            }
        }

        function checkMatches() {
            let hasMatches = false;
            // Filas
            for (let i = 0; i < 49; i++) {
                if (i % width < 5) {
                    let rowCheck = [i, i+1, i+2];
                    let decidedCandy = board[i].innerText;
                    if (decidedCandy && rowCheck.every(index => board[index].innerText === decidedCandy)) {
                        score += 30;
                        rowCheck.forEach(index => board[index].innerText = '');
                        hasMatches = true;
                    }
                }
            }
            // Columnas
            for (let i = 0; i < 35; i++) {
                let colCheck = [i, i+width, i+width*2];
                let decidedCandy = board[i].innerText;
                if (decidedCandy && colCheck.every(index => board[index].innerText === decidedCandy)) {
                    score += 30;
                    colCheck.forEach(index => board[index].innerText = '');
                    hasMatches = true;
                }
            }
            scoreDisplay.innerText = score;
            if (hasMatches) setTimeout(refillBoard, 300);
        }

        function refillBoard() {
            for (let i = 0; i < 49; i++) {
                if (board[i].innerText === '') {
                    board[i].innerText = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                }
            }
            checkMatches();
        }

            document.getElementById('modal-title').innerText = "¡Fin de Movimientos!";
            document.getElementById('modal-text').innerText = `Lograste ${score} puntos. ¿Quieres comprar movimientos extra para ganar de inmediato?`;
            document.getElementById('payment-zone').style.display = 'block';
            modal.style.display = 'flex';
        }

            document.getElementById('modal-title').innerText = "Tienda MessiCandy";
            document.getElementById('modal-text').innerText = "Obtén 5 movimientos adicionales para no perder tu puntuación alta.";
            document.getElementById('payment-zone').style.display = 'block';
            modal.style.display = 'flex';
        }
