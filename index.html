<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessiCandy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1d2b64, #f8cdda);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; font-size: 2.5rem; text-shadow: 2px 2px rgba(0,0,0,0.6); }
        .level-badge {
            background: #e74c3c; padding: 4px 15px; border-radius: 15px;
            font-weight: bold; font-size: 0.9rem; margin-bottom: 10px;
        }
        .stats {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            width: 100%; max-width: 330px;
            display: flex; justify-content: space-between;
        }
        .stats span { color: #f1c40f; }
        .progress-container {
            width: 100%; max-width: 330px; background: #444;
            border-radius: 10px; height: 12px; margin-bottom: 15px; overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 0%; height: 100%; transition: width 0.3s ease;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(7, 42px);
            grid-template-rows: repeat(7, 42px);
            gap: 5px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .cell {
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        .cell.selected {
            background: rgba(255,255,255,0.4);
            box-shadow: 0 0 10px #fff;
        }
        .btn {
            margin-top: 15px;
            background: #e91e63;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%; max-width: 330px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #009ee3;
            z-index: 100;
            width: 85%; max-width: 320px;
        }
        .modal h2 { color: #f1c40f; margin-bottom: 10px; }
        .modal input {
            padding: 10px; margin: 12px 0; width: 90%;
            text-align: center; font-size: 1rem; border-radius: 5px;
            color: #000; font-weight: bold;
        }
        .mp-link {
            display: inline-block; background: #009ee3; color: white;
            padding: 12px 24px; border-radius: 20px; text-decoration: none;
            font-weight: bold; margin-bottom: 10px; width: 90%;
        }
    </style>
</head>
<body>

    <h1>MessiCandy</h1>
    <div class="level-badge">Nivel <span id="lbl-level">1</span></div>

    <div class="stats">
        <div>Pts: <span id="score">0</span>/500</div>
        <div>Movs: <span id="moves">20</span></div>
    </div>

    <div class="progress-container">
        <div id="progress" class="progress-fill"></div>
    </div>

    <div id="grid"></div>

    <button class="btn" onclick="openShop()">🛒 Tienda: +5 Movimientos</button>

    <div id="modal" class="modal">
        <h2 id="m-title">Tienda MessiCandy</h2>
        <p id="m-text">Consigue 5 movimientos extra</p>
        
        <!-- Tu Link Real y Verificado de Mercado Pago -->
        <a class="mp-link" target="_blank" href="https://mpago.la">Pagar con Mercado Pago</a>
        
        <p style="font-size:0.8rem; color:#aaa;">(Tras abonar, escribe el código secreto de tu recibo)</p>
        <input type="text" id="code" placeholder="Código Secreto">
        <button class="btn" style="margin-top:0; width:90%; background:#009ee3;" onclick="verify()">Activar Movimientos</button>
        <button class="btn" style="background:#444; font-size:0.8rem; padding:5px 10px; width:90%;" onclick="closeModal()">Cerrar</button>
    </div>

    <script>
        const width = 7;
        const grid = document.getElementById('grid');
        const candies = ['🍬', '🍭', '🍫', '🍩', '🍪'];
        let board = [];
        let score = 0;
        let moves = 20;
        let level = 1;
        let targetScore = 500;
        let firstClick = null;

        function start() {
            grid.innerHTML = '';
            board = [];
            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = i;
                cell.innerText = candies[Math.floor(Math.random() * candies.length)];
                cell.onclick = clickCell;
                grid.appendChild(cell);
                board.push(cell);
            }
            match();
        }

        function clickCell() {
            if (moves <= 0) return;
            if (!firstClick) {
                firstClick = this;
                this.classList.add('selected');
            } else {
                let id1 = parseInt(firstClick.id);
                let id2 = parseInt(this.id);
                let valid = [id1-1, id1+1, id1-width, id1+width];

                if (valid.includes(id2)) {
                    let tmp = firstClick.innerText;
                    firstClick.innerText = this.innerText;
                    this.innerText = tmp;
                    moves--;
                    document.getElementById('moves').innerText = moves;
                    match();
                    if (moves <= 0 && score < targetScore) over();
                }
                firstClick.classList.remove('selected');
                firstClick = null;
            }
        }

        function match() {
            let found = false;
            for (let i = 0; i < 49; i++) {
                if (i % width < 5) {
                    if (board[i].innerText && board[i].innerText === board[i+1].innerText && board[i].innerText === board[i+2].innerText) {
                        score += 30; board[i].innerText = ''; board[i+1].innerText = ''; board[i+2].innerText = ''; found = true;
                    }
                }
                if (i < 35) {
                    if (board[i].innerText && board[i].innerText === board[i+width].innerText && board[i].innerText === board[i+width*2].innerText) {
                        score += 30; board[i].innerText = ''; board[i+width].innerText = ''; board[i+width*2].innerText = ''; found = true;
                    }
                }
            }
            
            document.getElementById('score').innerText = score;
            let percent = Math.min((score / targetScore) * 100, 100);
            document.getElementById('progress').style.width = percent + '%';

            if (score >= targetScore) {
                setTimeout(nextLevel, 400);
                return;
            }

            if (found) setTimeout(fill, 200);
        }

        function fill() {
            for (let i = 0; i < 49; i++) {
                if (board[i].innerText === '') board[i].innerText = candies[Math.floor(Math.random() * candies.length)];
            }
            match();
        }

        function nextLevel() {
            level++;
            score = 0;
            moves = 20;
            alert('¡EXCELENTE! Avanzaste al Nivel ' + level);
            document.getElementById('lbl-level').innerText = level;
            document.getElementById('score').innerText = score;
            document.getElementById('moves').innerText = moves;
            document.getElementById('progress').style.width = '0%';
            start();
        }

        function openShop() {
            document.getElementById('m-title').innerText = "Tienda MessiCandy";
            document.getElementById('m-text').innerText = "Adquiere 5 movimientos extra con Mercado Pago.";
            document.getElementById('modal').style.display = 'block';
        }

        function over() {
            document.getElementById('m-title').innerText = "¡Fin de Movimientos!";
            document.getElementById('m-text').innerText = `Te faltaron puntos para ganar. ¿Quieres comprar 5 movimientos para continuar?`;
            document.getElementById('modal').style.display = 'block';
        }

        function verify() {
            if (document.getElementById('code').value.trim().toUpperCase() === 'MESSI777') {
                moves = 5; document.getElementById('moves').innerText = moves;
                document.getElementById('modal').style.display = 'none';
                document.getElementById('code').value = '';
                alert('¡Movimientos añadidos! Que te diviertas.');
            } else { alert('Código incorrecto. Verifica tu pago.'); }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; if(moves<=0) { level=1; score=0; moves=20; document.getElementById('lbl-level').innerText=level; start(); } }

        start();
    </script>
</body>
</html>
