<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessiCandy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #701c1c, #401050);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        h1 { color: #f1c40f; margin-bottom: 10px; font-size: 2.2rem; text-shadow: 2px 2px rgba(0,0,0,0.5); }
        .stats {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stats span { color: #f1c40f; }
        #grid {
            display: grid;
            grid-template-columns: repeat(7, 42px);
            grid-template-rows: repeat(7, 42px);
            gap: 5px;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 15px;
        }
        .cell {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            user-select: none;
            -webkit-user-select: none;
        }
        .cell.selected {
            background: rgba(255,255,255,0.4);
            box-shadow: 0 0 10px #fff;
        }
        .btn {
            margin-top: 20px;
            background: #ff007f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ff007f;
            z-index: 100;
            width: 85%;
        }
        .modal h2 { color: #f1c40f; margin-bottom: 10px; }
        .modal input {
            padding: 10px; margin: 10px 0; width: 90%;
            text-align: center; font-size: 1rem; border-radius: 5px;
        }
        .paypal-link {
            display: inline-block; background: #0070ba; color: white;
            padding: 10px 20px; border-radius: 20px; text-decoration: none;
            font-weight: bold; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>MessiCandy</h1>

    <div class="stats">
        Puntos: <span id="score">0</span> | Movimientos: <span id="moves">20</span>
    </div>

    <div id="grid"></div>

    <button class="btn" onclick="openShop()">🛒 Tienda: +5 Movimientos (1.99€)</button>

    <div id="modal" class="modal">
        <h2 id="m-title">Tienda MessiCandy</h2>
        <p id="m-text">Consigue 5 movimientos extra</p>
        <a class="paypal-link" target="_blank" href="https://paypal.com">Pagar 1.99€ en PayPal</a>
        <input type="text" id="code" placeholder="Código de Recibo">
        <button class="btn" style="margin-top:0; width:90%;" onclick="verify()">Activar Movimientos</button>
        <button class="btn" style="background:#444; font-size:0.8rem; padding:5px 10px;" onclick="closeModal()">Cerrar</button>
    </div>

    <script>
        const width = 7;
        const grid = document.getElementById('grid');
        const candies = ['🍬', '🍭', '🍫', '🍩', '🍪'];
        let board = [];
        let score = 0;
        let moves = 20;
        let firstClick = null;

        function start() {
            grid.innerHTML = '';
            board = [];
            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = i;
                cell.innerText = candies[Math.floor(Math.random() * candies.length)];
                cell.onclick = clickCell;
                grid.appendChild(cell);
                board.push(cell);
            }
            match();
        }

        function clickCell() {
            if (moves <= 0) return;
            if (!firstClick) {
                firstClick = this;
                this.classList.add('selected');
            } else {
                let id1 = parseInt(firstClick.id);
                let id2 = parseInt(this.id);
                let valid = [id1-1, id1+1, id1-width, id1+width];

                if (valid.includes(id2)) {
                    let tmp = firstClick.innerText;
                    firstClick.innerText = this.innerText;
                    this.innerText = tmp;
                    moves--;
                    document.getElementById('moves').innerText = moves;
                    match();
                    if (moves <= 0) over();
                }
                firstClick.classList.remove('selected');
                firstClick = null;
            }
        }

        function match() {
            let found = false;
            for (let i = 0; i < 49; i++) {
                if (i % width < 5) {
                    if (board[i].innerText && board[i].innerText === board[i+1].innerText && board[i].innerText === board[i+2].innerText) {
                        score += 30; board[i].innerText = ''; board[i+1].innerText = ''; board[i+2].innerText = ''; found = true;
                    }
                }
                if (i < 35) {
                    if (board[i].innerText && board[i].innerText === board[i+width].innerText && board[i].innerText === board[i+width*2].innerText) {
                        score += 30; board[i].innerText = ''; board[i+width].innerText = ''; board[i+width*2].innerText = ''; found = true;
                    }
                }
            }
            document.getElementById('score').innerText = score;
            if (found) setTimeout(fill, 200);
        }

        function fill() {
            for (let i = 0; i < 49; i++) {
                if (board[i].innerText === '') board[i].innerText = candies[Math.floor(Math.random() * candies.length)];
            }
            match();
        }

        function openShop() {
            document.getElementById('m-title').innerText = "Tienda MessiCandy";
            document.getElementById('m-text').innerText = "Compra 5 movimientos para ganarle a tus amigos.";
            document.getElementById('modal').style.display = 'block';
        }

        function over() {
            document.getElementById('m-title').innerText = "¡Fin del Juego!";
            document.getElementById('m-text').innerText = `Puntuación: ${score}. ¿Quieres comprar 5 movimientos para continuar?`;
            document.getElementById('modal').style.display = 'block';
        }

        function verify() {
            if (document.getElementById('code').value.trim().toUpperCase() === 'MESSI777') {
                moves = 5; document.getElementById('moves').innerText = moves;
                document.getElementById('modal').style.display = 'none';
                document.getElementById('code').value = '';
                alert('¡Movimientos añadidos!');
            } else { alert('Código incorrecto'); }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; if(moves<=0) start(); }

        window.onload = start;
    </script>
</body>
</html>
